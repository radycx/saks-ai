name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Kimi_Agent_食安助手文档/app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./Kimi_Agent_食安助手文档/app

      - name: Build
        run: npm run build
        working-directory: ./Kimi_Agent_食安助手文档/app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Kimi_Agent_食安助手文档/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
